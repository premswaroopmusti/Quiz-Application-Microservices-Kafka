spring.application.name=quiz-history-service

server.port=8091

# PostgreSQL Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/quizhistorydb
spring.datasource.username=postgres
spring.datasource.password=Enter your password here

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=quiz-history-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# JSON Deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.quiz_history_service.event,com.example.quiz_service.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.quiz_history_service.event.QuizCompletedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
