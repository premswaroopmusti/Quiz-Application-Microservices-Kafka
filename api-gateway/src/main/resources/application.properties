spring.application.name=api-gateway

server.port=8765

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# Quiz Service route
spring.cloud.gateway.server.webmvc.routes[0].id=quiz-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://quiz-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/quiz-service/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# Quiz History Service route
spring.cloud.gateway.server.webmvc.routes[1].id=quiz-history-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://quiz-history-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/quiz-history/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.http-client.type=simple

# Force Spring Boot to use the simple JDK HTTP client
spring.http.clients.imperative.factory=simple


